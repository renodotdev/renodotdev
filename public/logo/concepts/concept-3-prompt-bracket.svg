<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <filter id="glow-lime-c3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ── Chamfered Tech Badge (44x44) ───────────────── -->
  <g transform="translate(10, 10)">
    <!-- Chamfered polygon: top-right cut corner (Neo-Brutalist classic) -->
    <path d="M 6 0 H 32 L 44 12 V 38 C 44 41.3 41.3 44 38 44 H 6 C 2.7 44 0 41.3 0 38 V 6 C 0 2.7 2.7 0 6 0 Z" 
          fill="#0a0c10" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2" />

    <!-- Terminal Command Prompt chevron `>` in crisp white -->
    <path d="M 10 16 L 16 22 L 10 28" 
          stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Technical 'R' glyph -->
    <path d="M 21 30 V 16 H 27 C 29.5 16 31 17.5 31 19.5 C 31 21.5 29.5 23 27 23 H 23 M 24 23 L 31 30" 
          stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Active Phosphor Lime Terminal Cursor Block `■` -->
    <rect x="33" y="24" width="4" height="6" rx="0.5" fill="#a3e635" filter="url(#glow-lime-c3)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- ── Wordmark ───────────────────────────────────── -->
  <!-- "reno.dev" -->
  <text x="68" y="37" font-family="'JetBrains Mono', monospace" font-size="21" font-weight="800" letter-spacing="-0.03em" fill="#ffffff">
    reno<tspan fill="#a3e635">.</tspan>dev
  </text>

  <!-- System Monospace Badge -->
  <g transform="translate(182, 23)">
    <rect width="78" height="16" rx="3" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <text x="39" y="11.5" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" letter-spacing="0.1em" fill="#8b949e" text-anchor="middle">
      AI // MOBILE
    </text>
  </g>
</svg>
