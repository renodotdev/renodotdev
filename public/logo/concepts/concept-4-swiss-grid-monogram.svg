<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <filter id="glow-lime-c4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ── Swiss Grid Monogram (44x44) ────────────────── -->
  <g transform="translate(10, 10)">
    <!-- Base Container -->
    <rect width="44" height="44" rx="6" fill="#08090a" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.2" />

    <!-- Technical Inner Hairline Grid -->
    <line x1="6" y1="22" x2="38" y2="22" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="2 2" />
    <line x1="22" y1="6" x2="22" y2="38" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="2 2" />

    <!-- Open Bracket `[` -->
    <path d="M 12 14 H 9 V 30 H 12" stroke="#8b949e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Architectural R -->
    <path d="M 16 30 V 14 H 23 C 26 14 27.5 15.5 27.5 18 C 27.5 20.5 26 22 23 22 H 18 M 20 22 L 26.5 30" 
          stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Phosphor Lime Coordinate Node `.` -->
    <rect x="29" y="26" width="4.5" height="4.5" rx="1" fill="#a3e635" filter="url(#glow-lime-c4)" />

    <!-- Close Bracket `]` -->
    <path d="M 35 14 H 38 V 30 H 35" stroke="#8b949e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ── Wordmark ───────────────────────────────────── -->
  <!-- "renodotdev" -->
  <text x="68" y="34" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="800" letter-spacing="-0.03em" fill="#ffffff">
    reno<tspan fill="#ffffff" font-weight="400">dot</tspan>dev
  </text>

  <!-- Coordinates & Subline -->
  <text x="68" y="47" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="0.14em" fill="#a3e635">
    [SYS_COORDINATE: 01] &bull; STUDIO
  </text>
</svg>
