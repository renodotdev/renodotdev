      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a3e635" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Frame -->
  <rect x="2" y="2" width="44" height="44" rx="8" fill="#08090a" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" />

